# ==============================================================================
# Workflow: 06 - Security Scan (CodeQL)
# Description: Automated SAST (Static Application Security Testing) pipeline
#              using GitHub CodeQL engine to detect AST/taint-flow vulnerabilities.
# Permissions: Least Privilege model (security-events: write for SARIF upload).
# ==============================================================================

name: "06 - Security Scan (CodeQL)"

on: 
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
  contents: read
  security-events: write
  actions: read
    

jobs:
    CodeQL:
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v4
            
            - name: "Initialize CodeQL"
              uses: github/codeql-action/init@v3
              with:
                languages: 'python'
                queries: security-extended,security-and-quality

            - name: "Perform CodeQL Analysis"
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:python"



