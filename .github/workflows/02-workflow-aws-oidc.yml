# ==============================================================================
# WORKFLOW: Zero-Trust AWS Auth via OIDC
# DESCRIPTION: OpenID Connect, JWT Claims, IAM Trust Policies, Least Privilege, 
#              Passwordless CI/CD.
# TARGET CERTIFICATION: GitHub Actions (GH-200) - Domain 2 & Domain 3
# ==============================================================================
name: "02 - AWS Authentication via OIDC"

on: 
  workflow_dispatch: # manual

permissions:
  id-token: write # GitHub Actions generates Web Identity Token (JWT)
  contents: read # GitHub reads repos

jobs:
  AssumeRoleJob:
    runs-on: ubuntu-latest
    steps:
      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARN_AWS_ROLE_OIDC}}
          aws-region: us-east-1
      - name: "Test AWS STS"
        run: aws sts get-caller-identity

