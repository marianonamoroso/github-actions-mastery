# ==============================================================================
# WORKFLOW: 04 - CD Pipeline Orchestrator (Caller Workflow)
# DESCRIPTION: Orchestrates multi-environment Continuous Delivery (Staging -> Production)
#              by invoking a reusable workflow with sequential dependencies (needs)
#              and environment-bound approval gates.
# TARGET CERTIFICATION: GitHub Actions (GH-200) - Domain 1 (Authoring & Managing Workflows) 
#                                               & Domain 2 (Managing Workflows for Enterprise)
# ==============================================================================
name: "04 - CD Pipeline Orchestrator (Caller Workflow)"

on:
  workflow_dispatch:
    inputs:
      app-name:
        description: "Application name"
        required: true
        default: "mna-service"

jobs:
  DeployStaging:
    uses: ./.github/workflows/04-reusable-cd.yml
    with:
      app-name: ${{ inputs.app-name }}
      environment: staging
    secrets: inherit

  DeployProduction:
    needs: DeployStaging
    uses: ./.github/workflows/04-reusable-cd.yml
    with:
      app-name: ${{ inputs.app-name }}
      environment: production
    secrets: inherit
    

  

 